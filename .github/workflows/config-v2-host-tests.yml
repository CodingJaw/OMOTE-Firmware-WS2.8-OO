name: Config v2 host safety tests

on:
  push:
    branches:
      - feature/config-v2-transactional
  pull_request:
    paths:
      - 'Platformio/lib/esp32HalImpl/wifiHandler/config_v2_*'
      - 'Platformio/tools/config-v2-tests/**'
      - '.github/workflows/config-v2-host-tests.yml'

concurrency:
  group: config-v2-host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Install firmware-compatible JSON parser headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rapidjson-dev
      - name: Compile and run isolated storage tests
        run: bash Platformio/tools/config-v2-tests/run-host-tests.sh
