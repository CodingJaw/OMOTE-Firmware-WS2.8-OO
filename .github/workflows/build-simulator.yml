name: Ubuntu Simulator Build

on: [push]

jobs:
  build-ubuntu:
    # Avoid GCC 11 template-instantiation ICE on 22.04 and Python 3.9
    # setup failure on 26.04; Ubuntu 24.04 ships a newer host compiler.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Install SDL2
        run : sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install cURL
        run : sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install Boost
        run : sudo apt-get update && sudo apt-get install -y libboost-all-dev
      
      - name: Build PlatformIO Project 64 bit sim
        working-directory: ./Platformio
        run: pio run --environment x64_sim